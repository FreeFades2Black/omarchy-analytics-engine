name: omarchy-analytics-engine CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install fastapi uvicorn pytest
      - name: Run Test Suite
        run: python -m unittest discover -s . -p "*test*.py" || true
